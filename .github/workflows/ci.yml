name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -race -count=1

      - name: CLI smoke
        shell: bash
        run: |
          go run ./cmd/canon commands > /dev/null
          go run ./cmd/canon doctor > /dev/null

      - name: Config smoke
        shell: bash
        run: |
          go run ./cmd/canon config show > /dev/null
          go run ./cmd/canon config validate > /dev/null

      - name: Dry-run mutation smoke
        shell: bash
        run: |
          go run ./cmd/canon --adr-dir "$RUNNER_TEMP/canon-smoke/adr" \
            adr new --title "CI smoke" --dry-run | grep -q "No changes were made."

  install:
    name: Install script
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install dry-run
        run: scripts/install.sh --dry-run
